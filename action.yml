name: UpdateSubmodules
description: GitHub action for updating references to submodules in parent repo

inputs:
  parent:
    description: "Repo that must be updated"
    required: true
  token:
    description: "Personal Access Token with rights to push the parents repos"
    required: true
  commit_message:
    description: "Message used when commits are created"
    required: false
    default: "chore: Update Submodules [skip ci]"

runs:
  using: composite
  steps:
    - name: Extract branch name
      shell: bash
      run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
      id: extract_branch

    # artipacked is intentionally allowed here: the persisted credentials are
    # required by the later steps (git submodule update --remote, git pull,
    # git push) to authenticate against the parent repo and its submodules.
    # The leak vector artipacked warns about (uploading .git as an artifact)
    # does not exist: this action never uploads artifacts.
    - name: Checkout parent
      uses: actions/checkout@v6.0.3 # zizmor: ignore[artipacked]
      with:
        repository: ${{ inputs.parent }}
        token: ${{ inputs.token }}
        submodules: 'recursive'
        ref: ${{ steps.extract_branch.outputs.branch }}
        fetch-depth: 0

    - name: Update submodules
      shell: bash
      run: git submodule update --remote --recursive

    - name: Switch to updated branch for each submodule
      shell: bash
      run: git submodule foreach git checkout ${GITHUB_REF#refs/heads/}

    - name: Create update commit
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        branch="${GITHUB_REF#refs/heads/}"

        git config user.email "github@meblabs.com"
        git config user.name "MeblabsBot"
        git add --all
        git diff --cached --quiet || git commit -m "$COMMIT_MESSAGE"

        max_attempts=5

        for ((attempt = 1; attempt <= max_attempts; attempt++)); do
          git fetch origin "$branch"
          git rebase FETCH_HEAD

          if git push origin "HEAD:$branch"; then
            exit 0
          fi

          if ((attempt == max_attempts)); then
            echo "::error::Push failed after $max_attempts attempts"
            exit 1
          fi

          delay=$((attempt * 2 + RANDOM % 4))
          echo "Concurrent update detected; retrying in ${delay}s..."
          sleep "$delay"
        done
